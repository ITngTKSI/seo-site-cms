services:
  strapi:
    container_name: cricket-news-strapi
    image: node:20-alpine
    working_dir: /srv/app
    restart: unless-stopped
    command: sh -c "if [ ! -f /srv/app/package.json ]; then rm -rf /srv/app/* /srv/app/.*[!.]* 2>/dev/null || true; printf 'n\n' | npx -y create-strapi-app@latest /srv/app --quickstart --no-run --dbclient postgres --dbhost postgres --dbport 5432 --dbname strapi --dbusername strapi --dbpassword $${DATABASE_PASSWORD}; fi && cd /srv/app && npm install && npm run build && npm run start"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me-in-production}
      DATABASE_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-production}
      APP_KEYS: ${APP_KEYS:-change-me-in-production}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-change-me-in-production}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-change-me-in-production}
      NODE_ENV: production
    volumes:
      - ./strapi-app:/srv/app
      - ./strapi-uploads:/srv/app/public/uploads
    ports:
      - '1337:1337'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - strapi-network

  postgres:
    container_name: cricket-news-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-in-production}
      POSTGRES_DB: strapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strapi-network

volumes:
  postgres-data:
    name: cricket-news-postgres-data

networks:
  strapi-network:
    name: cricket-news-network

